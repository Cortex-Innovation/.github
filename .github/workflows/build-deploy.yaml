name: Build & Deploy (Reusable)

# Reusable workflow consumed by per-app `<app>/.github/workflows/deploy.yaml`.
#
# Behaviors:
#   1. OIDC login to AWS via the shared `github-actions-ci` IAM role
#   2. Login to ECR + auto-create the per-app repo on first push
#   3. Build Dockerfile from repo root
#   4. Tag image with first 8 chars of GITHUB_SHA + push to ECR
#   5. Write-back the new tag/repository to a values.yaml — TWO modes:
#
#      a) gitops mode (recommended) — when `gitops-repo` +
#         `gitops-values-path` inputs are set, clones the gitops repo,
#         updates the file at the given path, commits + pushes back.
#         Uses a GitHub App installation token (cross-repo write).
#
#      b) legacy self-repo mode (fallback) — when gitops-repo is
#         empty, updates `values.yaml` in the calling repo (kept for
#         repos that haven't migrated to centralized gitops).

on:
  workflow_call:
    inputs:
      aws-region:
        required: true
        type: string
      aws-account-id:
        required: true
        type: string
      role-arn:
        required: true
        type: string

      build-args:
        required: false
        type: string
        default: ""
        description: |
          Extra `--build-arg` entries for `docker build`, one KEY=VALUE per
          line. Blank lines and lines starting with `#` are ignored.

          APP_VERSION (short SHA) and APP_REVISION (full SHA) are always
          passed and do not belong here.

          Non-secret values only. Build args are recorded in the image
          history and readable by anyone who can pull the image. For a
          secret, use a BuildKit secret mount instead — see
          SENTRY_AUTH_TOKEN in the secrets note below.

      # Gitops write-back mode (recommended)
      gitops-repo:
        required: false
        type: string
        default: ""
        description: "Target gitops repo as <owner>/<repo>. When set, write-back goes here instead of the calling repo."
      gitops-values-path:
        required: false
        type: string
        default: ""
        description: "Path inside gitops-repo to the values.yaml that holds image.repository + image.tag."
      gitops-values-source:
        required: false
        type: string
        default: "helm-values/values.yaml"
        description: |
          Path inside the CALLING repo to the source values.yaml that
          this workflow uses to seed the gitops file on first push
          (when gitops-values-path does not exist yet). Default:
          `helm-values/values.yaml`. Subsequent pushes only inject
          image fields and do not re-seed.
      gitops-branch:
        required: false
        type: string
        default: "main"
        description: "Branch in gitops-repo to commit to. Default: main."

      gitops-app-id:
        required: false
        type: string
        default: ""
        description: "GitHub App ID (numeric, NOT secret) used to mint cross-repo write tokens. Required when gitops-repo is set."

      # Argo CD UI write-back (Application spec.info)
      # When ARGOCD_AUTH_TOKEN reaches via `secrets: inherit` AND argocd-server
      # is set, the workflow appends image/digest/commit/built entries to the
      # Application's spec.info so they render as clickable rows in the UI
      # Summary panel — alongside the static `App source` and `Values overlay`
      # entries declared in the cortex-gitops ApplicationSet template.
      argocd-server:
        required: false
        type: string
        default: ""
        description: "Argo CD API host (e.g. argocd.eks-cortex-platform-prd-us-east-1.estabilis-cortex.com). When empty the UI write-back step is skipped."
      argocd-app-name:
        required: false
        type: string
        default: ""
        description: "Argo CD Application name to update. Default: lowercase repo name (matches the ApplicationSet path.basename convention)."

    # Secrets reaching via `secrets: inherit` at the caller:
    # - GITOPS_APP_PRIVATE_KEY — required when gitops-repo is set
    # - ARGOCD_AUTH_TOKEN     — required when argocd-server is set
    # - SENTRY_AUTH_TOKEN     — optional. When present, it is mounted into
    #   `docker build` as a BuildKit secret with id `sentry_auth_token`, so a
    #   Dockerfile can upload source maps during the build:
    #
    #     RUN --mount=type=secret,id=sentry_auth_token,required=false \
    #         SENTRY_AUTH_TOKEN="$(cat /run/secrets/sentry_auth_token 2>/dev/null || true)" \
    #         npm run build
    #
    #   Absent secret, absent flag: builds that do not use it are untouched.
    #   No `secrets:` block is declared on purpose — adding one would change
    #   what `secrets: inherit` delivers to the callers that already depend
    #   on the two secrets above.
    # App ID is passed as a regular input above (it's public information;
    # no need to mask).

permissions:
  id-token: write   # OIDC AssumeRoleWithWebIdentity
  contents: write   # legacy self-repo write-back fallback

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute lowercase repo name (ECR rejects uppercase)
        id: repo
        run: |
          NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        env:
          REPO_NAME: ${{ steps.repo.outputs.name }}
        run: |
          aws ecr describe-repositories --repository-names "$REPO_NAME" 2>/dev/null || \
            aws ecr create-repository --repository-name "$REPO_NAME" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE

      - name: Build, tag and push
        id: meta
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
          EXTRA_BUILD_ARGS: ${{ inputs.build-args }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # BuildKit is the default on the hosted runners already; setting it
          # explicitly is a no-op there and guarantees `--secret` is available.
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::8}"
          IMAGE="$REGISTRY/$REPO_NAME:$TAG"

          # APP_VERSION / APP_REVISION are declared as ARG by the app templates
          # and feed the OCI image labels. They were never passed, so every
          # image in the registry carried `version=dev` and an empty revision —
          # the labels claimed to identify the build and identified nothing.
          # A build arg the Dockerfile does not declare is a warning, not an
          # error, so repos without those ARGs are unaffected.
          BUILD_ARGS=(--build-arg "APP_VERSION=$TAG" --build-arg "APP_REVISION=$GITHUB_SHA")

          # Optional extras from the caller, one KEY=VALUE per line.
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -z "${line// /}" ] && continue
            case "$line" in \#*) continue ;; esac
            BUILD_ARGS+=(--build-arg "$line")
          done <<< "${EXTRA_BUILD_ARGS:-}"

          # Secrets must NOT travel as build args: those are recorded in the
          # image history and readable by anyone who can pull the image. A
          # BuildKit secret is mounted for the duration of one RUN and leaves
          # no trace in any layer. Absent secret, absent flag — the 40-odd
          # repos that do not set it build exactly as before.
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            BUILD_ARGS+=(--secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN)
            echo "::notice::Sentry auth token available to the build (BuildKit secret mount)"
          fi

          echo "::notice::docker build with ${#BUILD_ARGS[@]} extra flag(s)"
          docker build "${BUILD_ARGS[@]}" -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not parse sha256 digest from buildx; got: $DIGEST"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed $IMAGE @ $DIGEST"

      # ─── Gitops write-back (cross-repo) ─────────────────────────────

      - name: Parse gitops-repo into owner / repo
        if: inputs.gitops-repo != ''
        id: gitops-parse
        env:
          GITOPS_REPO: ${{ inputs.gitops-repo }}
        run: |
          IFS='/' read -r OWNER REPO <<< "$GITOPS_REPO"
          if [ -z "$OWNER" ] || [ -z "$REPO" ]; then
            echo "::error::gitops-repo must be in <owner>/<repo> format, got: $GITOPS_REPO"
            exit 1
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Verify gitops PEM secret reaches the reusable workflow
        if: inputs.gitops-repo != ''
        env:
          PEM: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${PEM:-}" ]; then
            echo "::error::GITOPS_APP_PRIVATE_KEY is empty in this workflow context. Caller must use \`secrets: inherit\` AND the org secret must allow this repo."
            exit 1
          fi
          echo "::notice::GITOPS_APP_PRIVATE_KEY reached (length=${#PEM})"

      - name: Generate gitops App installation token
        if: inputs.gitops-repo != ''
        id: gitops-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.gitops-app-id }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.gitops-parse.outputs.owner }}
          repositories: ${{ steps.gitops-parse.outputs.repo }}

      - name: Update image in gitops values file
        if: inputs.gitops-repo != ''
        env:
          TOKEN: ${{ steps.gitops-token.outputs.token }}
          OWNER: ${{ steps.gitops-parse.outputs.owner }}
          REPO: ${{ steps.gitops-parse.outputs.repo }}
          BRANCH: ${{ inputs.gitops-branch }}
          VALUES_PATH: ${{ inputs.gitops-values-path }}
          SOURCE_PATH: ${{ inputs.gitops-values-source }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
          CALLER_REPO_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail

          GITOPS_DIR="$(mktemp -d)"

          # Retry the clone: a freshly minted GitHub App installation token is
          # not immediately usable on every GitHub edge cache. The token is
          # valid — the mint step above succeeded — but a clone routed to a
          # cache that has not replicated it yet is answered as if the repo did
          # not exist:
          #
          #   remote: Repository not found.
          #   fatal: repository '.../cortex-gitops.git/' not found   (exit 128)
          #
          # This is GitHub's own explanation and their recommended mitigation
          # (wait, then retry with growing backoff) — see
          # https://github.com/aws-amplify/amplify-hosting/issues/4080, where
          # AWS Amplify shipped exactly this fix. The replication delay is not
          # exposed by any API, so it cannot be waited out deterministically.
          #
          # Measured here on 2026-08-25: 3 failed attempts across 25 runs, each
          # needing a manual re-run. The backoff below (3s, 10s, 30s) is the
          # interval GitHub support recommends. It also absorbs plain transport
          # flakes mid-transfer (`fatal: expected 'packfile'`), which accounted
          # for one of those three.
          #
          # The push steps further down already retry; this was the only bare
          # git operation left in the workflow.
          clone_ok=""
          for delay in 0 3 10 30; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            if git clone --depth 1 --branch "$BRANCH" \
                 "https://x-access-token:${TOKEN}@github.com/${OWNER}/${REPO}.git" "$GITOPS_DIR"; then
              clone_ok=1
              break
            fi
            # git leaves the target dir behind on a partial clone; a retry into
            # a non-empty directory fails for the wrong reason.
            rm -rf "${GITOPS_DIR:?}"/* "${GITOPS_DIR:?}"/.[!.]* 2>/dev/null || true
            echo "::warning::clone of ${OWNER}/${REPO} failed (token replication or transport); retrying"
          done
          if [ -z "$clone_ok" ]; then
            echo "::error::clone of ${OWNER}/${REPO} failed after 4 attempts (0s, 3s, 10s, 30s)"
            exit 1
          fi
          cd "$GITOPS_DIR"

          # Two modes:
          # - File missing in gitops → SEED MODE: copy from caller repo's
          #   helm-values/values.yaml (or whatever `gitops-values-source`
          #   says), then inject image fields. This happens on the first
          #   successful build of a project bootstrapped via Crossplane —
          #   the Composition does NOT pre-create the gitops file (it
          #   used to, with placeholder image, which made the AppSet
          #   spawn a broken pod before the build ran).
          # - File exists → UPDATE MODE: only inject image fields,
          #   leaving the rest owned by whoever last edited the file.
          MODE="update"
          if [ ! -f "$VALUES_PATH" ]; then
            MODE="seed"
            SOURCE_FULL="$CALLER_REPO_DIR/$SOURCE_PATH"
            if [ ! -f "$SOURCE_FULL" ]; then
              echo "::error::Source values not found in calling repo: $SOURCE_PATH"
              echo "  (looked at: $SOURCE_FULL)"
              exit 1
            fi
            mkdir -p "$(dirname "$VALUES_PATH")"
            cp "$SOURCE_FULL" "$VALUES_PATH"
          fi

          # yq is pre-installed on ubuntu-latest runners (Mike Farah v4).
          # On seed: also write fullnameOverride/nameOverride/service-label
          # (these are derived from the repo name, not authored by the dev).
          if [ "$MODE" = "seed" ]; then
            yq -i ".fullnameOverride = \"${REPO_NAME}\"" "$VALUES_PATH"
            yq -i ".nameOverride = \"${REPO_NAME}\"" "$VALUES_PATH"
            yq -i ".commonLabels[\"estabilis.io/service\"] = \"${REPO_NAME}\"" "$VALUES_PATH"
          fi

          # Image fields owned by every build (seed and update both).
          # Digest is the runtime-pinning source (Kyverno PSS Restricted
          # requires it); tag is a human breadcrumb for debugging.
          yq -i ".image.repository = \"${REGISTRY}/${REPO_NAME}\"" "$VALUES_PATH"
          yq -i ".image.tag = \"${TAG}\"" "$VALUES_PATH"
          yq -i ".image.digest = \"${DIGEST}\"" "$VALUES_PATH"

          # `git status` covers BOTH modify (update) and add (seed).
          if [ -z "$(git status --porcelain "$VALUES_PATH")" ]; then
            echo "::notice::No changes to ${VALUES_PATH} (already at digest ${DIGEST})"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VALUES_PATH"
          if [ "$MODE" = "seed" ]; then
            git commit -m "feat(${REPO_NAME}): seed values.yaml + first image ${TAG} (${DIGEST}) [skip ci]"
          else
            git commit -m "chore(${REPO_NAME}): bump image to ${TAG} (${DIGEST}) [skip ci]"
          fi
          # Retry-with-rebase on push race. When multiple repos build at the
          # same time (e.g. operator creates N projects in cortex-projects in
          # quick succession), each build-deploy workflow pulls cortex-gitops
          # main, creates its own values.yaml in a separate dir, and pushes.
          # The first push wins; subsequent ones get
          # "remote rejected: cannot lock ref" (non-fast-forward). Each new
          # commit is in a different file path with no real conflict, so
          # `pull --rebase` reconciles cleanly. 3 attempts cover dozens of
          # concurrent builds; jittered sleep avoids thundering herd.
          for attempt in 1 2 3; do
            if git push origin "$BRANCH"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::push to ${OWNER}/${REPO} ${BRANCH} failed after 3 attempts (concurrent build race)"
              exit 1
            fi
            echo "::warning::push race attempt $attempt — pulling rebase + retry"
            git pull --rebase origin "$BRANCH"
            sleep $((RANDOM % 5 + 1))
          done

          echo "::notice::${MODE^} ${OWNER}/${REPO}/${VALUES_PATH} to ${TAG} @ ${DIGEST}"

      # ─── Caller-repo cleanup: remove the seed file ────────────────────
      #
      # The seed `helm-values/values.yaml` in the calling repo is only
      # consumed once (the first time `gitops-values-path` does not
      # exist in cortex-gitops). After that, it's misleading noise — the
      # source of truth for runtime config is the cortex-gitops
      # values.yaml. Remove it from the app repo on the first
      # successful seed so devs don't think edits there matter.
      #
      # Idempotent: if the file isn't there, this is a no-op. The
      # `[skip ci]` tag on the cleanup commit prevents this push from
      # re-triggering the workflow.
      - name: Remove seed helm-values from caller repo
        if: inputs.gitops-repo != ''
        env:
          SOURCE_PATH: ${{ inputs.gitops-values-source }}
        run: |
          set -euo pipefail
          if [ ! -f "$SOURCE_PATH" ]; then
            echo "::notice::Seed file not present at $SOURCE_PATH — nothing to clean up."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$SOURCE_PATH"
          # Drop the parent dir if it became empty (e.g. helm-values/).
          PARENT=$(dirname "$SOURCE_PATH")
          if [ -d "$PARENT" ] && [ -z "$(ls -A "$PARENT")" ]; then
            rmdir "$PARENT"
          fi
          git commit -m "chore: remove seed ${SOURCE_PATH} (now owned by cortex-gitops) [skip ci]"
          # Use the caller-workflow's GITHUB_TOKEN; permissions:contents:write
          # is granted by the caller's deploy.yaml (templates already set it).
          # Retry-with-rebase: app repo could have received another push
          # between our checkout and now (rare but possible when the
          # build-deploy workflow runs alongside an unrelated CI commit).
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::caller-repo cleanup push failed after 3 attempts"
              exit 1
            fi
            echo "::warning::push race attempt $attempt — pulling rebase + retry"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((RANDOM % 5 + 1))
          done
          echo "::notice::Removed seed ${SOURCE_PATH} from caller repo (one-shot post-seed cleanup)."

      # ─── Argo CD UI write-back (spec.info) ──────────────────────────
      #
      # Append image/digest/commit/built entries to the Application's
      # `spec.info` so the Argo CD UI Summary panel surfaces what is
      # actually deployed (multi-source apps otherwise show only the
      # common-app chart version, hiding the real app version). The
      # static `App source` and `Values overlay` entries are declared
      # inline in the cortex-gitops ApplicationSet template and re-sent
      # here on each call so a `argocd app set --info` (which replaces
      # the whole list) does not strip them.
      #
      # The cortex-gitops ApplicationSet must carry
      # `spec.ignoreApplicationDifferences: [{jsonPointers: [/spec/info]}]`
      # for these dynamic entries to survive subsequent reconciles.

      - name: Determine Argo CD app name
        if: inputs.argocd-server != ''
        id: argocd-app
        env:
          OVERRIDE: ${{ inputs.argocd-app-name }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
        run: |
          NAME="${OVERRIDE:-$REPO_NAME}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Install Argo CD CLI
        if: inputs.argocd-server != ''
        run: |
          set -euo pipefail
          # Pin minor; cluster runs v3.3.x and CLI is forward-compatible
          # with the same major. Bump together when the platform bumps
          # the chart.
          ARGOCD_VERSION="v3.3.2"
          curl -sSL -o /usr/local/bin/argocd \
            "https://github.com/argoproj/argo-cd/releases/download/${ARGOCD_VERSION}/argocd-linux-amd64"
          chmod +x /usr/local/bin/argocd
          argocd version --client | head -1

      # NON-FATAL ON PURPOSE.
      #
      #   This step is cosmetic: it enriches the Argo CD UI Summary panel so a
      #   multi-source app shows the real app version instead of only the
      #   common-app chart version. Useful, but it must never turn a green
      #   build red.
      #
      #   It needs `applications, update` on the app's AppProject. That grant
      #   was REMOVED from the `ci-writeback` account on 2026-08-19
      #   (cortex-platform-aws-us-east-1-prd#189): `update` allows rewriting the
      #   Application spec, and while the AppProject bounds the blast radius,
      #   `destinations` is a wildcard over `app-*` — so it would allow making
      #   one app deploy into another app's namespace. The account is meant to
      #   trigger a sync, nothing more.
      #
      #   So this step is EXPECTED to log a 403 today. The sync step below is
      #   the one that matters and it does not need `update`. If the enrichment
      #   ever becomes worth the grant, restore the RBAC line and drop this
      #   `continue-on-error`.
      - name: Update Argo CD Application spec.info
        if: inputs.argocd-server != ''
        continue-on-error: true
        env:
          ARGOCD_SERVER: ${{ inputs.argocd-server }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APP: ${{ steps.argocd-app.outputs.name }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITOPS_REPO: ${{ inputs.gitops-repo }}
          VALUES_PATH: ${{ inputs.gitops-values-path }}
        run: |
          set -euo pipefail

          if [ -z "${ARGOCD_AUTH_TOKEN:-}" ]; then
            echo "::error::ARGOCD_AUTH_TOKEN is empty. Caller must use \`secrets: inherit\` AND the org secret must be visible to this repo."
            exit 1
          fi

          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT_URL="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          APP_SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}"

          # Argo CD v3.x removed `argocd app set --info`; use `app patch`
          # with a merge patch instead. The patch replaces the whole
          # `spec.info` array — so the static entries declared in the
          # ApplicationSet template (App source + Values overlay) are
          # re-sent on every call to keep them present in the UI.
          INFO_JSON='[]'
          INFO_JSON=$(jq -nc \
            --arg app_source "${APP_SOURCE_URL}" \
            --arg values_overlay_repo "${GITOPS_REPO:-}" \
            --arg values_overlay_path "${VALUES_PATH:-}" \
            --arg image "${REGISTRY}/${REPO_NAME}:${TAG}" \
            --arg digest "${DIGEST}" \
            --arg commit "${COMMIT_URL}" \
            --arg built "${BUILT_AT}" \
            '
            [{name: "App source", value: $app_source}]
            + (if $values_overlay_repo != "" and $values_overlay_path != ""
               then [{name: "Values overlay", value: ("https://github.com/" + $values_overlay_repo + "/blob/main/" + $values_overlay_path)}]
               else []
               end)
            + [
                {name: "Image",  value: $image},
                {name: "Digest", value: $digest},
                {name: "Commit", value: $commit},
                {name: "Built",  value: $built}
              ]
            ')

          PATCH=$(jq -nc --argjson info "$INFO_JSON" '{spec: {info: $info}}')
          argocd app patch "${APP}" --type merge --patch "$PATCH" --grpc-web

          echo "::notice::Updated Argo CD Application '${APP}' info with ${TAG} @ ${DIGEST}"

      # ─── Immediate sync trigger ─────────────────────────────────────
      #
      # WHY THIS EXISTS
      #
      #   Without it the cluster only picks up the new image when Argo CD's
      #   reconciliation loop comes around. On the prd cluster that is
      #   `timeout.reconciliation: 120s` plus `timeout.reconciliation.jitter:
      #   60s` — UP TO THREE MINUTES. The pipeline finishes "success" while the
      #   previous version is still serving, and whoever checks right after the
      #   merge concludes the deploy failed. That confusion is the reason this
      #   step was added.
      #
      # NO RACE WITH THE GITOPS COMMIT
      #
      #   `Update image in gitops values file` runs far earlier in this same
      #   job, so by the time this step executes the new value is already on
      #   the GitOps repo's main branch. The sync reads the committed state,
      #   not a pending one.
      #
      # WHY --async
      #
      #   It fires and returns. The step still FAILS if the CALL fails — a
      #   broken integration (bad token, RBAC, unreachable server) must be
      #   visible — but it does not wait for the rollout, so CI stays
      #   decoupled from cluster health.
      #
      #   To make the build ALSO go red when the DEPLOY itself fails, drop
      #   `--async`: the step then blocks until Argo CD converges. That is a
      #   deliberate contract change for every repo passing `argocd-server`,
      #   which is why it is not the default here.
      #
      # RBAC
      #
      #   The `ci-writeback` account needs `applications, sync` on the app's
      #   AppProject. Until 2026-08-19 that grant pointed at a project that did
      #   not exist (`workload-infra`), so the account could do nothing at all
      #   — including the `app patch` above. Fixed in
      #   cortex-platform-aws-us-east-1-prd#188, currently scoped to a
      #   two-app pilot.
      - name: Trigger Argo CD sync
        if: inputs.argocd-server != ''
        env:
          ARGOCD_SERVER: ${{ inputs.argocd-server }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APP: ${{ steps.argocd-app.outputs.name }}
        run: |
          set -euo pipefail
          argocd app sync "${APP}" --async --timeout 60 --grpc-web
          echo "::notice::Argo CD sync triggered for '${APP}'"

      # ─── Legacy self-repo write-back (fallback) ─────────────────────

      - name: Update image in self values.yaml (legacy)
        if: inputs.gitops-repo == ''
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.meta.outputs.digest }}
          REPO_NAME: ${{ steps.repo.outputs.name }}
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          yq -i ".image.repository = \"${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO_NAME}\"" values.yaml
          yq -i ".image.tag = \"${TAG}\"" values.yaml
          yq -i ".image.digest = \"${DIGEST}\"" values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add values.yaml
          git diff --cached --quiet || git commit -m "chore: update image to ${TAG} (${DIGEST}) [skip ci]"
          git push
